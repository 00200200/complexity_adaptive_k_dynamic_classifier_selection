repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format
  - repo: local
    hooks:
      - id: pylint
        name: pylint (via uv)
        entry: uv run pylint
        language: system
        types: [python]
        require_serial: true
        args: ['--output-format=colorized']
