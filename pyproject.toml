[project]
name = "complexity-adaptive-k-dynamic-classifier-selection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deslib>=0.3.7",
    "imblearn>=0.0",
    "liac-arff>=2.5.0",
    "numpy<2.0,>=1.24",
    "pandas>=2.0",
    "problexity>=0.5.11",
    "pycol-complexity>=1.0.0",
    "scikit-learn<1.4,>=1.3",
    "seaborn>=0.13.2",
    "xgboost>=3.0.5",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "pre-commit>=4.3.0",
    "pylint>=4.0.1",
    "ruff>=0.6.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = "\\.(py|pyi)$"
extend-exclude = [
    "^/data/",
    "^/.venv/",
    "^/uv.lock",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  
    "W",  
    "F",  
    "I",  
    "B",  
    "C4", 
    "UP",
]
ignore = [
    "E501", 
    "B008",  
    "C901",  
    "B905",  
    "E722", 
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-statements",
    "too-many-branches",
    "too-many-nested-blocks",
    "invalid-name",
    "line-too-long",
    "bare-except",
    "broad-exception-caught",
    "import-outside-toplevel",
    "unused-argument",
    "unspecified-encoding",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 88
